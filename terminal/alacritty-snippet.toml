# Optional Alacritty additions. NOT applied by install.sh — your alacritty.toml is
# hand-maintained, and colors.toml is generated by chroma ("do not edit by hand").
#
# Copy anything you want into ~/.config/alacritty/alacritty.toml.

# Claude Code sets the terminal title when `terminalTitle` is enabled in settings.json.
# Let Alacritty display it rather than forcing a static title.
[window]
dynamic_title = true

# Long agent turns scroll a lot; the default 10000 fills quickly.
[scrolling]
history = 50000

# The statusline uses powerline separators (U+E0B0). Any Nerd Font provides them —
# 2772 Nerd Font faces are already installed on this machine, so this is only needed
# if you switch to a font that lacks them.
# [font.normal]
# family = "RecMonoSmCasual Nerd Font"
